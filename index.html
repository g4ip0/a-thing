<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Forced Visibility</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene background="color: #B0B0B0">

      <!-- CAMERA (FORCED) -->
      <a-entity
        camera
        position="0 1.6 5"
        look-controls>
      </a-entity>

      <!-- LIGHT (FORCED) -->
      <a-light type="ambient" intensity="1"></a-light>
      <a-light type="directional" position="1 3 2"></a-light>

      <!-- SPINNING GROUP -->
      <a-entity
        position="0 1 -3"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">

        <a-cone
          radius-bottom="0.5"
          height="1"
          color="#FF8C00"
          position="0 0 0">
        </a-cone>

        <a-cylinder
          radius="0.15"
          height="0.6"
          color="#1E90FF"
          position="1.2 0 0">
        </a-cylinder>

      </a-entity>

      <!-- STATIC CUBE -->
      <a-box
        position="-2 0.5 -2"
        width="1"
        height="1"
        depth="1"
        color="#4CC3D9">
      </a-box>

    </a-scene>
  </body>
</html>
