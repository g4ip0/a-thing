<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>A-Frame Scene</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene>

      <!-- ROTATING GROUP (PARENT) -->
      <a-entity
        position="-1 1 -4"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">

        <!-- CUBE (CHILD) -->
        <a-box
          position="0 0 0"
          depth="0.5"
          height="0.5"
          width="0.5"
          color="#4CC3D9">
        </a-box>

        <!-- SMALL CYLINDER (CHILD) -->
        <a-cylinder
          position="1 0 0"
          radius="0.15"
          height="0.5"
          color="#FFC65D">
        </a-cylinder>

      </a-entity>

      <!-- STATIC CUBE -->
      <a-box
        position="2 0.5 -4"
        depth="1"
        height="1"
        width="1"
        color="#EF2D5E">
      </a-box>

      <!-- GREY BACKGROUND -->
      <a-sky color="#AAAAAA"></a-sky>

    </a-scene>
  </body>
</html>
