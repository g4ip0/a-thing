<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>A-Frame Scene</title>

    <!-- FORCE PAGE SIZE -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>

    <!-- A-FRAME -->
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>

  <body>
    <a-scene
      renderer="antialias: true"
      background="color: #B0B0B0">

      <!-- CAMERA -->
      <a-entity
        camera
        position="0 1.6 4"
        look-controls>
      </a-entity>

      <!-- LIGHT -->
      <a-light
        type="directional"
        intensity="1"
        position="1 2 1">
      </a-light>

      <a-light
        type="ambient"
        intensity="0.4">
      </a-light>

      <!-- SPINNING GROUP -->
      <a-entity
        position="0 1 -3"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">

        <a-cone
          radius-bottom="0.5"
          height="1"
          color="#FF8C00"
          position="0 0 0">
        </a-cone>

        <a-cylinder
          radius="0.15"
          height="0.6"
          color="#1E90FF"
          position="1.2 0 0">
        </a-cylinder>

      </a-entity>

      <!-- STATIC CUBE -->
      <a-box
        position="-2 0.5 -2"
        width="1"
        height="1"
        depth="1"
        color="#4CC3D9">
      </a-box>

    </a-scene>
  </body>
</html>
