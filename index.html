<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Main Scene</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <a-entity
        position="0 1 -3"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">

        <a-box color="#4CC3D9"></a-box>

        <a-sphere
          position="1.5 0 0"
          radius="0.3"
          color="#EF2D5E">
        </a-sphere>

      </a-entity>

      <a-sky color="#ECECEC"></a-sky>

    </a-scene>
  </body>
</html>
