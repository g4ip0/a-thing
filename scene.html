<a-scene>

  <!-- SPINNING GROUP -->
  <a-entity
    position="0 1 -4"
    animation="property: rotation; to: 0 360 0; loop: true; dur: 3000">

    <!-- Cone -->
    <a-cone
      radius-bottom="0.5"
      height="1"
      color="#FF8C00"
      position="0 0 0">
    </a-cone>

    <!-- Small Cylinder -->
    <a-cylinder
      radius="0.15"
      height="0.6"
      color="#1E90FF"
      position="1.2 0 0">
    </a-cylinder>

  </a-entity>

  <!-- STATIC CUBE -->
  <a-box
    position="-2 0.5 -3"
    size="1 1 1"
    color="#4CC3D9">
  </a-box>

  <!-- GREY BACKGROUND -->
  <a-sky color="#B0B0B0"></a-sky>

</a-scene>
